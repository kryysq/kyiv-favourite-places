{% extends "base.html" %}

{% block title %}
Реєстрація — Kyiv Places
{% endblock %}

{% block content %}

<div class="container">

    <h1>Реєстрація</h1>

    <form method="post">

        {% csrf_token %}

        {{ form.as_p }}

        <button type="submit" class="button">
            Зареєструватися
        </button>

    </form>

    <p>
        Вже є акаунт?
        <a href="{% url 'login' %}">Увійти</a>
    </p>

</div>

{% endblock %}
