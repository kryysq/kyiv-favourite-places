{% load static %}

<!DOCTYPE html>
<html lang="uk">

<head>
    <meta charset="UTF-8">

    <title>Реєстрація</title>

    <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>

<body>

    <header>
        <div class="container">
            <h1>Реєстрація</h1>
        </div>
    </header>

    <main>
        <div class="container">

            <form method="post">

                {% csrf_token %}

                {{ form.as_p }}

                <button type="submit" class="button">
                    Зареєструватися
                </button>

            </form>

            <p>
                Вже маєте акаунт?
                <a href="{% url 'login' %}">
                    Увійти
                </a>
            </p>

        </div>
    </main>

</body>

</html>
