{% load static %}

<!DOCTYPE html>

<html lang="uk">

<head>
    <meta charset="UTF-8">

```
<title>
    {% block title %}Kyiv Places{% endblock %}
</title>

<link rel="stylesheet" href="{% static 'css/style.css' %}">
```

</head>

<body>

```
<header class="site-header">
    <div class="container header-content">

        <a href="{% url 'home' %}" class="logo">
            Kyiv Places 🏙️
        </a>

        <nav>
            <a href="{% url 'home' %}">Головна</a>

            {% if user.is_authenticated %}
                <a href="{% url 'add_place' %}">
                    Додати місце
                </a>

                <a href="{% url 'logout' %}">
                    Вийти
                </a>
            {% else %}
                <a href="{% url 'login' %}">
                    Увійти
                </a>

                <a href="{% url 'register' %}">
                    Реєстрація
                </a>
            {% endif %}
        </nav>

    </div>
</header>

<main>
    {% block content %}
    {% endblock %}
</main>

<footer class="site-footer">
    <p>
        Kyiv Places • Створено Крістіною Іваненко, 2026
    </p>
</footer>
```

</body>

</html>
